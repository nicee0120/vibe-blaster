<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vibe Blaster</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&family=Orbitron:wght@700&display=swap">
<style>
:root{--bg:#101214;--panel:#1b1f22;--ink:#101214;--lime:#dff902;--green:#dff902;--teal:#35f2d8;--tx:#e9efe9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:500 16px/1.4 Rubik,system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:900px;padding:12px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-weight:800;font-size:22px;letter-spacing:.5px}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.hud span b{display:inline-block;min-width:2ch}
.wrap{position:relative;border:4px solid var(--ink);border-radius:10px;overflow:hidden;background:#101214;box-shadow:0 6px 0 var(--green);border-color:var(--green)}
canvas{display:block;width:100%;height:auto;touch-action:none}
.logo{width:240px;max-width:80%;height:auto;image-rendering:auto}.wm{font-weight:800;font-size:20px;letter-spacing:.5px;color:#e9efe9;margin:0}.wm i{color:var(--green);font-style:normal}.big{font-size:34px!important;letter-spacing:2px;color:var(--green)}
input{font:500 15px Rubik,system-ui,sans-serif;width:100%;padding:9px 10px;border-radius:8px;border:2px solid var(--green);background:#0b0d0e;color:#fff}
.lbl{list-style:none;margin:0;padding:0;width:100%;max-height:200px;overflow:auto;text-align:left;font-size:14px}.lbl li{display:flex;gap:8px;padding:5px 8px;border-bottom:1px solid #2d3300}.lbl li b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbl li.me{background:#dff90233}.tok{font-size:13px;color:var(--lime);word-break:break-all}
.sub{background:var(--panel)!important}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;overflow-y:auto;gap:10px;text-align:center;background:rgba(20,18,16,.78);color:#fff;padding:16px}
.ov.hide{display:none}
.ov h2{margin:0;font-size:24px;font-weight:800}
.ov p{margin:0}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;width:100%;max-width:640px}
.pick button{padding:4px 2px;background:var(--panel);color:#fff;font:600 11px Rubik,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--ink);border-width:2px}
.pick button.sel{border-color:var(--lime);background:#2a3300}
.pick img{width:52px;height:52px;object-fit:contain;display:block}
.crew{display:flex;gap:4px;justify-content:center}.crew img{width:38px;height:38px;object-fit:contain;animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}@media (prefers-reduced-motion:reduce){.crew img{animation:none}}.mm{display:flex;flex-direction:column;gap:10px;width:220px}.mm button{font-size:16px;padding:8px 16px}.mm button+button,#set button{background:#1b1f22;color:#fff}.wrap:has(.ov:not(.hide)){min-height:min(620px,92vh)}
.cdesc{min-height:36px;margin:0;font-size:14px;color:var(--lime)}
button{font:800 16px Rubik,system-ui,sans-serif;color:var(--ink);background:var(--lime);border:3px solid var(--ink);border-radius:8px;padding:8px 16px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center}
.pad button{padding:0;font-size:20px}
.pad .u{grid-column:2}.pad .l{grid-row:2;grid-column:1}.pad .d{grid-row:2;grid-column:2}.pad .r{grid-row:2;grid-column:3}
.hint{text-align:center;font-size:13px;opacity:.75;margin:0}
</style>
</head>

  g.strokeStyle='rgba(223,249,2,.12)';g.lineWidth=2;g.setLineDash([6,10]);g.strokeRect(ZX0-45,ZY0-45,ZX1-ZX0+90,ZY1-ZY0+90);g.setLineDash([]);

   if(!(inv>0&&(t*14|0)%2)){
    if(supT>0){g.strokeStyle='rgba(223,249,2,'+(.5+.3*Math.sin(t*10))+')';g.lineWidth=3;g.beginPath();g.ellipse(px,py,34,40,0,0,7);g.stroke()}
    for(const c of clones()){g.globalAlpha=.75;g.fillStyle='rgba(223,249,2,.35)';g.beginPath();g.ellipse(c.x,c.y+31,13,4,0,0,7);g.fill();sprite(pi,c.x,c.y+30,true,52);g.globalAlpha=1}
    g.fillStyle='rgba(223,249,2,.35)';g.strokeStyle='#101214';g.lineWidth=2;g.beginPath();g.ellipse(px,py+31,16,5,0,0,7);g.fill();g.stroke();
    if(sh)drawShip(px,py+6);
    sprite(pi,px-recoil*4,py+(sh?24:30),true,64)}}
  for(const h of hearts)heart(h.x-10,(h.yy||h.y)-9,'#ff4d6d',3);
  en.forEach(drawBot);discs.forEach(drawDisc);for(const b of beams){g.globalAlpha=Math.min(1,b.l/.14);g.strokeStyle=b.c;g.lineWidth=12;g.beginPath();g.moveTo(b.x,b.y);g.lineTo(W,b.y);g.stroke();g.strokeStyle='#fff';g.lineWidth=3;g.stroke();g.globalAlpha=1}
  if(wave){const gr=g.createLinearGradient(wave.x-90,0,wave.x+6,0);gr.addColorStop(0,'rgba(223,249,2,0)');gr.addColorStop(1,'rgba(223,249,2,.9)');g.fillStyle=gr;g.fillRect(wave.x-90,0,96,H);g.fillStyle='#fff';g.fillRect(wave.x,0,6,H);g.fillStyle='rgba(223,249,2,.12)';g.fillRect(0,0,wave.x,H)}
  for(const b of bul){g.fillStyle='#ff4d3d';g.strokeStyle='#101214';g.lineWidth=2;g.beginPath();g.arc(b.x,b.y,6,0,7);g.fill();g.stroke();g.fillStyle='#ffee66';g.beginPath();g.arc(b.x,b.y,2.5,0,7);g.fill()}
  for(const p of parts){g.globalAlpha=Math.min(1,p.l*2);g.fillStyle=p.c;g.fillRect(p.x,p.y,p.s,p.s)}g.globalAlpha=1;
  g.font='800 16px Rubik,sans-serif';g.textAlign='center';g.lineWidth=4;g.strokeStyle='#101214';
  for(const f of fl){g.globalAlpha=Math.min(1,f.l*2);g.fillStyle='#dff902';g.strokeText(f.s,f.x,f.y);g.fillText(f.s,f.x,f.y)}g.globalAlpha=1;
  // top hud: lives
  for(let i=0;i<MAXL;i++)heart(W/2-MAXL*13+i*26,10,i<lives?'#ff4d6d':'#2a3238',3);
  if(boss){const w=320,x=W/2-w/2;g.fillStyle='#101214';g.fillRect(x-3,40,w+6,14);g.fillStyle='#ff4d3d';g.fillRect(x,43,w*Math.max(0,boss.hp)/boss.mhp,8);g.fillStyle='#fff';g.font='800 11px Rubik,sans-serif';g.fillText('BUG BOSS',W/2,66)}
  if(phase!=='menu'){g.font='700 18px Orbitron,"Courier New",monospace';g.lineWidth=4;g.strokeStyle='#101214';g.fillStyle='#dff902';
    g.textAlign='left';const a='SCORE '+String(score).padStart(6,'0');g.strokeText(a,14,26);g.fillText(a,14,26);
    g.textAlign='right';const b='BEST '+String(Math.max(hi,score)).padStart(6,'0'),c='LEVEL '+String(level).padStart(2,'0');g.strokeText(b,W-14,26);g.fillText(b,W-14,26);g.font='700 14px Orbitron,"Courier New",monospace';g.strokeText(c,W-14,46);g.fillText(c,W-14,46);g.textAlign='center'}

    const bar=(y,lab,f,col,txt)=>{g.fillStyle='#101214';g.fillRect(12,y-2,136,12);g.globalAlpha=(f>=1&&(t*6|0)%2)?.5:1;g.fillStyle=col;g.fillRect(14,y,132*Math.min(1,f),8);g.globalAlpha=1;g.fillStyle='#fff';g.strokeText(lab+' '+txt,154,y+8);g.fillText(lab+' '+txt,154,y+8)};

    bar(54,'BURST',burC/BURN,'#dff902',Math.floor(100*burC/BURN)+'%');g.textAlign='center'}
  if(hurt>0){g.fillStyle='rgba(255,60,40,'+hurt*.3+')';g.fillRect(0,0,W,H)}

// input
function posP(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)*H/r.height;tx=ZX0+Math.max(0,Math.min(1,x))*(ZX1-ZX0);ty=Math.max(ZY0,Math.min(ZY1,y))}
cv.addEventListener('pointermove',posP);
cv.addEventListener('pointerdown',e=>{posP(e);fire();try{cv.setPointerCapture(e.pointerId)}catch(x){}});
const KM={ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d',ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r'};
addEventListener('keydown',e=>{if(KM[e.key]){e.preventDefault();keys[KM[e.key]]=1}else if(e.code==='Space'){e.preventDefault();if(!e.repeat)fire()}});
addEventListener('keyup',e=>{if(KM[e.key])keys[KM[e.key]]=0});
// menu
const pk=$('pick');
imgs.forEach((im,i)=>{const b=document.createElement('button');b.setAttribute('aria-label',CH[i].n);const c=new Image();c.src=im.src;const s=document.createElement('span');s.textContent=CH[i].n;b.appendChild(c);b.appendChild(s);b.onclick=()=>sel(i);pk.appendChild(b)});
function sel(i){pi=i;[...pk.children].forEach((b,j)=>b.classList.toggle('sel',j===i));$('cd').textContent=CH[i].n+': '+CH[i].d+' · Super: '+SUP[i].n}
sel(0);$('play').onclick=()=>{$('menu').classList.add('hide');start()};
$('again').onclick=()=>{$('over').classList.add('hide');start()};
$('chg').onclick=()=>{$('over').classList.add('hide');$('menu').classList.remove('hide');phase='menu'};
// token & leaderboard
const TOKEN={sym:'$VIBEBLASTER',addr:'',url:'https://testnet.vibevibe.fun/'};
let rows=[],prof={name:'',x:'',wallet:'',best:0,day:''},lbBack='menu',online=false;
try{Object.assign(prof,JSON.parse(localStorage.getItem('vb_prof')||'{}'))}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),okW=w=>/^0x[a-fA-F0-9]{40}$/.test(w),okX=x=>/^[A-Za-z0-9_]{1,15}$/.test(x);
const complete=()=>!!(prof.name&&okX(prof.x)&&okW(prof.wallet));
function saveProf(){try{localStorage.setItem('vb_prof',JSON.stringify(prof))}catch(e){}}
function renderLb(){
  let list=[...rows];
  if(!online&&prof.best&&prof.day===today())list=[{name:prof.name||'You',x:prof.x,best:prof.best}];
  list.sort((a,b)=>b.best-a.best);
  $('rows').innerHTML=list.length?list.slice(0,20).map((r,i)=>'<li class="'+(prof.name&&r.name===prof.name&&r.x===prof.x?'me':'')+'"><span>'+(i+1)+'.</span><b>'+esc(r.name||'Anonymous')+(r.x?' <small>@'+esc(r.x)+'</small>':'')+'</b><span>'+r.best+'</span></li>').join(''):'<li>No scores yet today. Be the first!</li>';
  $('st').textContent=online?'':'Offline mode: scores are kept on this device only.';
  $('rw').textContent='Resets daily at 00:00 UTC · Top 20 win '+TOKEN.sym+' · Top 3 also win 0.1 Sepolia ETH'+(TOKEN.addr?' · Token: '+TOKEN.addr:'');
}
const LBK={
  async start(cb){try{const r=await fetch('/api/scores');if(r.ok){online=true;cb((await r.json()).rows||[])}}catch(e){}},
  async submit(p,sc){try{const r=await fetch('/api/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:p.name,x:p.x,wallet:p.wallet,score:sc})});if(r.ok){const j=await r.json();rows=j.rows||rows;online=true;renderLb()}}catch(e){}}};
function loadLb(){LBK.start(r=>{rows=r;renderLb()})}
function pushScore(){if(complete()&&prof.day===today()&&prof.best>0)LBK.submit(prof,prof.best)}
loadLb();renderLb();
function openLb(back){lbBack=back;$('nm').value=prof.name;$('xh').value=prof.x;$('wl').value=prof.wallet;loadLb();renderLb();$('splash').classList.add('hide');$('menu').classList.add('hide');$('over').classList.add('hide');$('lb').classList.remove('hide')}
$('lb1').onclick=()=>openLb('menu');$('lb2').onclick=()=>openLb('over');
$('lbx').onclick=()=>{$('lb').classList.add('hide');$(lbBack).classList.remove('hide')};
$('sv').onclick=()=>{const n=$('nm').value.trim().slice(0,14),x=$('xh').value.trim().replace(/^@/,''),w=$('wl').value.trim();
  if(!n){$('st').textContent='Enter a nickname.';return}
  if(!okX(x)){$('st').textContent='Enter your X username (letters, numbers, _ ; max 15).';return}
  if(!okW(w)){$('st').textContent='Invalid wallet address (42 characters starting with 0x).';return}
  prof.name=n;prof.x=x;prof.wallet=w;saveProf();$('st').textContent='Saved.';pushScore()};
$('go').onclick=()=>{$('splash').classList.add('hide');$('menu').classList.remove('hide')};
$('lb0').onclick=()=>openLb('splash');
$('st0').onclick=()=>{$('splash').classList.add('hide');$('set').classList.remove('hide')};
$('setx').onclick=()=>{$('set').classList.add('hide');$('splash').classList.remove('hide')};
$('snd').onclick=()=>setSnd(!sndOn);$('snd').textContent='Sound: '+(sndOn?'On':'Off');
$('mback').onclick=()=>{$('menu').classList.add('hide');$('splash').classList.remove('hide')};
$('home').onclick=()=>{$('over').classList.add('hide');$('splash').classList.remove('hide');phase='menu'};
{const cr=$('crew');imgs.forEach((im,i)=>{const c=new Image();c.src=im.src;c.style.animationDelay=(i*.15)+'s';cr.appendChild(c)})}
$('tk').textContent=TOKEN.sym;


let last=0;function loop(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;if(phase==='play')update(dt);else t+=dt;draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);


window.__vbReady=1;
